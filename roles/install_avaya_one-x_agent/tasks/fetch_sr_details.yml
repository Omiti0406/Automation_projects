---
######################################################################
#               !!! fetch_sr_details.yml !!!                         #
#                                                                    #
# Function:                                                          #
#   - Search for SCTASKs assigned to group,return specific fields    #
#                                                                    #
#                                                                    #
######################################################################

- name: Search for SR assigned to group, return specific fields
  servicenow.servicenow.snow_record_find:
    username: "{{ snow_user }}"
    password: "{{ snow_passwd }}"
    instance: "{{ snow_instance }}"
    display_value: true
    table: sc_task
    query: "{{snow_item}}"
    return_fields:
      - number
      - short_description
      - request_item    
  register: ticket
  with_items: "{{snow_query}}"
  loop_control:
      loop_var: snow_item
  
- set_fact:
    tickets: "{{(tickets|default([])) + [item]}}"
  with_items: "{{ticket.results| map(attribute='record') |list}}"

- set_fact:
      tickets: []
  when: tickets is undefined
  
- debug:
    msg: "{{tickets}}"
  when: tickets is defined

- include_role: 
    name: servicenow_sctask
    tasks_from: progress
  vars:
    sr_number: "{{sctask.number}}"
    worknotes_msg: "Automation has started working on the ticket. Automation process ID: {{awx_job_id }}"
    sctask: "{{item}}"
  with_items: "{{tickets}}"
  when: tickets is defined and tickets != []
