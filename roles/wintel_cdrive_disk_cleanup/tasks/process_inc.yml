---
##########################################################################
# Description: This playbook will be triggered to process the individual # 
#              tickets with the complete workflow.                       #
##########################################################################

- name: Extracting required inputs from the ticket.
  block:
    - name: Pull the incident number
      set_fact:
        ticketNo: "{{ticket.number}}"
    - include_role:
        name: servicenow_inc
        tasks_from: progress
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Automation has started working on the ticket. Automation process id- {{awx_job_id}}"
    - name: pull the required inputs from the ticket
      set_fact:
        server: "{{ ticket.cmdb_ci.display_value }}"
        ticket_description: "{{ ticket.description }}"

    # To check verify the fetched inputs and update the ticket incase of insufficient data.
    - name: update the ticket if the inputs are not being pulled properly
      include_role:
        name: servicenow_inc
        tasks_from: failure_worknotes
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Error occured: Insufficient input data, automation is unable to process the incident."
      when: (server is not defined) or (server == "")
  rescue:
    - include_role:
        name: servicenow_inc
        tasks_from: failure_worknotes
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Error occured: Automation is unable to process the ticket, seems like required input parameters is eighter blank or not in the proper format."
      when: (server is not defined) or (server == "")


- name: print the inc number
  debug:
    msg: "Processing -> {{ticketNo}}"

- name: Checking server connectivity 
  block:
    - wait_for_connection:
        timeout: 60
      register: conncheck
      delegate_to: "{{ server }}.DOMAIN.ORGANIZATION.COM"  
    - set_fact:
        conncheck_failed: ""    
  rescue:
    - set_fact:
        conncheck_failed: "Automation is not able to process the ticket, server {{server}} is not reachable. Please handle it manually"
    
- name: call the playbook to clean C drive 
  when: (server is defined) and (server != "") and (conncheck_failed == "")
  block:
    - name: Task to cleam C drive
      when: "'C:' in ticket_description"
      import_tasks: wintel_cdrive_disk_cleanup.yml
      delegate_to: "{{ server }}.DOMAIN.ORGANIZATION.COM"

    - name: Update the output of the executed commands on the ticket.
      include_role:
        name: servicenow_inc
        tasks_from: work_notes_only
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "{{ ping_output_response_msg }}"
      when: ping_output_response_msg is defined and ping_output_response_msg != ""    

    - name: Update the output of the executed commands on the ticket.
      include_role:
        name: servicenow_inc
        tasks_from: work_notes_only
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "{{ before_drive_space_output }}"
      when: before_drive_space_output is defined and before_drive_space_output != ""      

    - name: Update the output of the executed commands on the ticket.
      include_role:
        name: servicenow_inc
        tasks_from: work_notes_only
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "{{ CDrive_cleanup_result_output }}"
      when: CDrive_cleanup_result_output is defined and CDrive_cleanup_result_output != ""
      
    - name: Update the output of the executed commands on the ticket.
      include_role:
        name: servicenow_inc
        tasks_from: work_notes_only
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "{{ after_drive_space_output }}"
      when: after_drive_space_output is defined and after_drive_space_output != ""    
      
    - name: comments added for manual checking  
      include_role:
        name: servicenow_inc
        tasks_from: work_notes_only
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Orchestrator did not able to clear required space from C drive on the triggered incident server hence reassigning the ticket to MS-Ops for further action by an engineer."
      when: (after_drive_space_flag == false) and (after_drive_space_flag is defined) and (server is defined) and (server != "") and (CDrive_cleanup_result_output is defined) and (CDrive_cleanup_result_output != "")

    - include_role:
        name: servicenow_inc
        tasks_from: user_assignment
      vars:
        inc_no: "{{ticketNo}}"
        user_assigned_to: ""    
      when: (after_drive_space_flag == false) and (after_drive_space_flag is defined) and (server is defined) and (server != "") and (CDrive_cleanup_result_output is defined) and (CDrive_cleanup_result_output != "")


    - name: comments added for manual checking  
      include_role:
        name: servicenow_inc
        tasks_from: success
      vars:
        snow_incident_id: "{{ticketNo}}"
        success_closing_note: "Cleanup done."
        resolve_message: "Cleanup done."  
      when: (after_drive_space_flag == true) and (after_drive_space_flag is defined) and (server is defined) and (server != "") and (CDrive_cleanup_result_output is defined) and (CDrive_cleanup_result_output != "")
      
    - name: task to find SQL Server
      when: (server is defined) and (server != "") and (CDrive_cleanup_result_output is not defined) and (CDrive_cleanup_result_output == "")
      import_tasks: find_SQL_Server.yml
      delegate_to: "{{ server }}.DOMAIN.ORGANIZATION.COM"
      
    - name: comments added for manual checking  
      include_role:
        name: servicenow_inc
        tasks_from: transfer
      vars:
        inc_no: "{{ticketNo}}"
        L2_group: "GDP OPS MSSQL"
        transfer_msg: "Triggered incident in this machine, is a SQL server, hence reassigning the ticket to GDP OPS MSSQL for further action by an engineer. No action taken by Automation."  
      when: (SQL_value_flag == true) and (SQL_value_flag is defined) and (server is defined) and (server != "") and (CDrive_cleanup_result_output is not defined) and (CDrive_cleanup_result_output == "")
    
    - name: Update the output of the executed commands on the ticket
      include_role:
        name: servicenow_inc
        tasks_from: work_notes_only
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Triggered incident in this machine, is an application server, hence reassigning the ticket to MS-Ops for further action by an engineer. No action taken by Orchestrator."
      when: (SQL_value_flag == false) and (SQL_value_flag is defined) and (server is defined) and (server != "") and (CDrive_cleanup_result_output is not defined) and (CDrive_cleanup_result_output == "")
        
    - include_role:
        name: servicenow_inc
        tasks_from: user_assignment
      vars:
        inc_no: "{{ticketNo}}"
        user_assigned_to: ""    
      when: (SQL_value_flag == false) and (SQL_value_flag is defined) and (server is defined) and (server != "") and (CDrive_cleanup_result_output is not defined) and (CDrive_cleanup_result_output == "")

        
    - name: Adding ticket as successfully executed list
      set_fact:
        success_tickets: "{{success_tickets + [ticketNo]}}"
 

  rescue:
    - name: To capture the errors in the playbook.
      include_role:
        name: servicenow_inc
        tasks_from: failure_worknotes
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Error occured: Automation is unable to process the ticket, hence routing it for manual intervention."
    - name: Trigger email on failure
      include_role:
        name: mail_notification
        tasks_from: failure_mail
      vars:
        ticket_id: "{{ticketNo}}"

      #Final worknotes on the ticket
- include_role:
    name: servicenow_inc
    tasks_from: work_notes_only
  vars:
    inc_no: "{{ticketNo}}"
    worknotes_msg: "{{conncheck_failed}}"
  when: conncheck_failed is defined and conncheck_failed != ""
      
- include_role:
    name: servicenow_inc
    tasks_from: work_notes_only
  vars:
    inc_no: "{{ticketNo}}"
    worknotes_msg: "Automation has added the below comments, engineer can have a look and proceed further."
  when: conncheck_failed is defined and conncheck_failed != ""
  
- include_role:
    name: servicenow_inc
    tasks_from: user_assignment
  vars:
    inc_no: "{{ticketNo}}"
    user_assigned_to: ""    
  when: conncheck_failed is defined and conncheck_failed != ""
 
  
- name: clearning the inputs of the ticket at the end
  set_fact:
    ticketNo: ""
    server: ""
    before_drive_space_output: ""
    CDrive_cleanup_result_output: ""
    FindSQLServer_output: ""
    after_drive_space_output: ""
    ticket_description: ""
    SQL_value_flag: ""
    after_drive_space_flag: ""
    conncheck_failed: ""
