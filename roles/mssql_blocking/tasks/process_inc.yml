---
##########################################################################
# Description: This playbook will be triggered to process the individual # 
#              tickets with the complete workflow.                       #
##########################################################################

- name: Extracting required inputs from the ticket.
  block:
    - name: Pull the incident number
      set_fact:
        ticketNo: "{{ticket.number}}"
    - include_role:
        name: servicenow_inc
        tasks_from: progress
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Automation has started working on the ticket. Automation process id- {{awx_job_id}}"
    - name: pull the required inputs from the ticket
      set_fact:
        server: "{{ticket.cmdb_ci.display_value}}"
        ticket_description: "{{ ticket.description }}"


    # To check verify the fetched inputs and update the ticket incase of insufficient data.
    - name: update the ticket if the inputs are not being pulled properly
      include_role:
        name: servicenow_inc
        tasks_from: failure_worknotes
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Error occured: Insufficient input data, automation is unable to process the incident."
      when: (server is not defined) or (server == "")
  rescue:
    - include_role:
        name: servicenow_inc
        tasks_from: failure_worknotes
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Error occured: Automation is unable to process the ticket, seems like required input parameters is eighter blank or not in the proper format."
      when: (server is not defined) or (server == "")


- name: print the inc number
  debug:
    msg: "Processing -> {{ticketNo}}"

- name: citadel username
  set_fact:
    sql_username: "{{ my_user }}"
  when: "'citadelsolutions' in ticket_description"
    
- name: citadel password
  set_fact:
    sql_password: "{{ my_pass }}"
  when: "'citadelsolutions' in ticket_description"

- name: wintel username
  set_fact:
    sql_username: "{{ ansible_user }}"
  when: "'domain.organization.com' in ticket_description"

- name: wintel password
  set_fact:
    sql_password: "{{ ansible_password }}"
  when: "'domain.organization.com' in ticket_description"  

- name: ansible_user
  debug:
    msg: "sql_username -> {{sql_username}}"

- name: block to import multiple playbooks.
  when: (server is defined) and (server != "")
  block:
    - name: task to find app owners DL
      import_tasks: find_to_address.yml
      delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM"  

    - name: task to call mssql playbook to run commands
      import_tasks: mssql_block.yml
      delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM"  

    - name: posting the output from custom module for MS Block
      include_role:
        name: servicenow_inc
        tasks_from: work_notes_only
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "{{ msblock_output }} "          
           

    - name: Iteration 2
      block:
      - name: Iteration 2 - wait for 15 mins 
        command: sleep 900
        async: 900
        poll: 300
        delegate_to: localhost 

      - set_fact:
          msblock_output: ""

      - set_fact:
          to_address: ""
        when: to_address is defined and to_address != ''

      - set_fact:
          to_address_error: ""
        when: to_address_error is defined and to_address_error != ''

      - name: task to find app owners DL
        import_tasks: find_to_address.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM"   

      - name: posting the error of find_to_address playbook
        when: to_address_error is defined and to_address_error != ''
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "{{ to_address_error }}" 

      - name: task to call mssql playbook to run commands
        import_tasks: mssql_block.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM"  

      - name: posting the work notes of custom module
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "{{ msblock_output }} "          

      - name: posting the work notes when blockings cannot be found
        when: "'Blocking has not found' in msblock_output"
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "Automation has monitored 15 minutes blocking sessions but could not be found hence ticket will be closed soon." 

      - name : close Ticket
        when: "'Blocking has not found' in msblock_output"
        include_role: 
          name: servicenow_inc
          tasks_from: success
        vars:
          inc_no: "{{ticketNo}}"
          resolve_message : "Blocking has auto cleared, hence Automation has resolved the ticket."
          success_closing_note: "success"
          
      - name: send mail if no blocking found
        when: "'Blocking has not found' in msblock_output"
        import_tasks: send_email_no_blocking_found.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM" 


    - name: Iteration 3
      when: "'Blocking has not found' not in msblock_output"
      block:
      - name: Iteration 3 - wait for 15 mins  
        command: sleep 900
        async: 900
        poll: 300
        delegate_to: localhost #("'Blocking has not found' not in msblock_output")

      - set_fact:
          msblock_output: ""

      - set_fact:
          to_address: ""
        when: to_address is defined and to_address != ''

      - set_fact:
          to_address_error: ""
        when: to_address_error is defined and to_address_error != ''

    
      - name: task to find app owners DL
        import_tasks: find_to_address.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM"  

      - name: posting the error of find_to_address playbook
        when: to_address_error is defined and to_address_error != ''
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "{{ to_address_error }}" 

      - name: task to call mssql playbook to run commands
        import_tasks: mssql_block.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM"  

      - name: posting the work notes of custom module
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "{{ msblock_output }} "          

      - name: posting the work notes when blockings cannot be found
        when: "'Blocking has not found' in msblock_output"
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "Automation has monitored 15 minutes blocking sessions but could not be found hence ticket will be closed soon." 

      - name : close Ticket
        when: "'Blocking has not found' in msblock_output"
        include_role: 
          name: servicenow_inc
          tasks_from: success
        vars:
          inc_no: "{{ticketNo}}"
          resolve_message : "Blocking has auto cleared, hence Automation has resolved the ticket."
          success_closing_note: "success"
          
      - name: send mail if no blocking found
        when: "'Blocking has not found' in msblock_output"
        import_tasks: send_email_no_blocking_found.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM" 

    - name: Iteration 4
      when: "'Blocking has not found' not in msblock_output"    
      block:
      - name: Iteration 4 - wait for 15 mins 
        command: sleep 900
        async: 900
        poll: 300
        delegate_to: localhost #("'Blocking has not found' not in msblock_output")

      - name: posting the work notes of blocking still alive
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "Blocking session is still alive, Automation will recheck for blockings next 10 minutes and will update the ticket accordingly. "
          
      - set_fact:
          msblock_output: ""

      - set_fact:
          to_address: ""
        when: to_address is defined and to_address != ''

      - set_fact:
          to_address_error: ""
        when: to_address_error is defined and to_address_error != '' 
        
      - name: task to find app owners DL
        import_tasks: find_to_address.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM"  

      - name: posting the error of find_to_address playbook
        when: to_address_error is defined and to_address_error != ''
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "{{ to_address_error }}" 

      - name: task to call mssql playbook to run commands
        import_tasks: mssql_block.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM"  

      - name: posting the work notes of custom module
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "{{ msblock_output }} "          

      - name: posting the work notes when blockings are alive
        when: "'Blocking has not found' not in msblock_output"
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "Blocking session is still alive, L1 Engineer will recheck for blockings on the alert server and will update the ticket accordingly." 

      - name: posting the work notes when blockings cannot be found
        when: "'Blocking has not found' in msblock_output"
        include_role:
          name: servicenow_inc
          tasks_from: work_notes_only
        vars:
          inc_no: "{{ticketNo}}"
          worknotes_msg: "Automation has monitored 15 minutes blocking sessions but could not be found hence ticket will be closed soon." 
          
      - name :  close Ticket
        when: "'Blocking has not found' in msblock_output"
        include_role: 
          name: servicenow_inc
          tasks_from: success
        vars:
          inc_no: "{{ticketNo}}"
          resolve_message : "Blocking has auto cleared, hence Automation has resolved the ticket."
          success_closing_note: "success"
          
      - name: send mail if no blocking found
        when: "'Blocking has not found' in msblock_output"
        import_tasks: send_email_no_blocking_found.yml
        delegate_to: "{{ server_winshell }}.DOMAIN.ORGANIZATION.COM" 

    - include_role:
        name: servicenow_inc
        tasks_from: user_assignment
      vars:
        inc_no: "{{ticketNo}}"
        user_assigned_to: ""    
    - name: Adding ticket as successfully executed list
      set_fact:
        success_tickets: "{{success_tickets + [ticketNo]}}"
 

  rescue:
    - name: To capture the errors in the playbook.
      include_role:
        name: servicenow_inc
        tasks_from: failure_worknotes
      vars:
        inc_no: "{{ticketNo}}"
        worknotes_msg: "Error occured: Automation is unable to process the ticket, hence routing it for manual intervention."
    - name: Trigger email on failure
      include_role:
        name: mail_notification
        tasks_from: failure_mail
      vars:
        ticket_id: "{{ticketNo}}"

- name: clearning the inputs of the ticket at the end
  set_fact:
    ticketNo: ""
    server: ""   
    msblock_output: ""
    to_address: ""
    to_address_error: ""
    server: ""
    to_address_output: ""
    sql_username: ""
    sql_password: ""
    
    
