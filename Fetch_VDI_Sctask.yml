---
###################################################################################
# Usecase Name: VDI Decommision (Fetch the VDI Sctask and add into CSV file)
# Playbook description: This playbook will fetch the SR tickets from ServiceNow  
#                       and call the Import Sctask playbook to import the sctask in CSV
# Version: v1.0
###################################################################################
- hosts: localhost
  gather_facts: no
  tasks:
  - block:
    - include_role: 
        name: VDI_Decomission
        tasks_from: fetch_sr_details
    - name: Total fetched SCTASKs details 
      debug:
        msg: "{{ tickets }}"
      when: tickets != []
     
    - debug:
        msg: "No Service request found"
      when: tickets == []    

    - name: success ticket list
      set_fact:
        success_tickets: []
    - include_role: 
        name: VDI_Decomission
        tasks_from: Import_Sctask
      vars:
        sctask: "{{item}}"
      with_items: "{{tickets}}"
      when: tickets != []

    - name: print successfully executed tickets
      debug:
        msg: "Success tickets -> {{success_tickets}}"

    - name: set metering matric 
      set_stats:
        data:
          success_ticket_list: "{{success_tickets | unique}}"
        per_host: no
      when: success_tickets is defined    
        
  
